{% set name = "trame-pyvista" %}
{% set version = "0.2.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 05f912651e8f97a2454c8e5650eed930c46317b61597c2a3613e6bcd2aa8c7f8

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=64
    - setuptools-scm >=8
    - pip
  run:
    - python >={{ python_min }}
    - pyvista >=0.48
    - trame >=3.9.1,<4.0.1
    - trame-client >=3.10,<4.1.1
    - trame-common >=1.2.4,<1.2.8
    - trame-dataclass >=2.2.1,<3
    - trame-rca >=2.11.6,<3
    - trame-server >=3.9,<4.0.1
    - trame-vtk >=2.11.16,<2.11.18
    - trame-vtklocal >=1.7.1,<2
    - trame-vuetify >=3.2.5,<3.2.7
    - wslink >=2.5,<2.5.8

test:
  imports:
    - trame
    - trame_pyvista
  commands:
    - pip check
    - python -c "import trame_pyvista; assert trame_pyvista.__version__ == '{{ version }}', trame_pyvista.__version__"
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/pyvista/trame-pyvista
  summary: Trame interface for PyVista
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - larsoner
